name: Build macOS (classic + sales invoice)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.edition }} · macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [classic, salesinvoice]
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build dmg + zip
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List output
        run: ls -lh release || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-mac-${{ matrix.arch }}
          path: |
            ${{ matrix.edition }}/release/*.dmg
            ${{ matrix.edition }}/release/*.zip
          if-no-files-found: warn
