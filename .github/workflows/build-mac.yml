name: Build macOS (classic + sales invoice)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.edition }} · macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [classic, salesinvoice]
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build dmg + zip
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename with edition label + checksums
        run: |
          ls -lh release || true
          for f in release/*.dmg release/*.zip; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            case "${{ matrix.edition }}" in
              classic) new="TradeDocs-classic-${base#TradeDocs-}" ;;
              salesinvoice) new="TradeDocs-salesinvoice-${base#TradeDocs-}" ;;
            esac
            mv "$f" "release/$new"
          done
          cd release
          shasum -a 256 *.dmg *.zip 2>/dev/null | tee SHA256SUMS.txt || true
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-mac-${{ matrix.arch }}
          path: |
            ${{ matrix.edition }}/release/*.dmg
            ${{ matrix.edition }}/release/*.zip
            ${{ matrix.edition }}/release/SHA256SUMS.txt
          if-no-files-found: warn

  release:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -lh dist

      - name: Build release notes with checksums
        run: |
          {
            echo "经典版 + 销售发票版 · macOS（arm64 / x64）"
            echo ""
            echo "**装之前先核对 sha256**（终端：\`shasum -a 256 文件名\`），对不上说明没下完。"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt 2>/dev/null || echo "(no checksums)"
            echo '```'
            echo ""
            echo "首次打开（未签名）：右键 → 打开；或 \`xattr -dr com.apple.quarantine /Applications/TradeDocs.app\`"
          } > NOTES.md
          cat NOTES.md

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-${{ github.run_number }}
          name: TradeDocs macOS build #${{ github.run_number }}
          body_path: NOTES.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
